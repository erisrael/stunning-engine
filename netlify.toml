# Netlify build settings. Next.js is detected automatically (OpenNext adapter).
# Set DATABASE_URL, CRON_SECRET and MYSEED_SHOW_DEMO_ACCOUNTS in Site configuration, Environment variables.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[functions]
  node_bundler = "esbuild"
