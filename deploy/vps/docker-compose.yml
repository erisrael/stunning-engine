# The Content Manager on a VPS: the app, Postgres (profile "localdb") and Caddy for HTTPS (profile "caddy").
# Run through deploy.sh, which sets APP_ROOT, RELEASE, DOMAIN, APP_PORT, POSTGRES_PASSWORD and COMPOSE_PROFILES
# from $APP_ROOT/.env. The project name myseed-cm keeps it apart from other sites on the same server.
name: myseed-cm

services:
  app:
    image: myseed-cm-app:${RELEASE:-latest}
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        NEXT_DEPLOYMENT_ID: ${RELEASE:-}
    restart: unless-stopped
    env_file:
      - ${APP_ROOT:?APP_ROOT is not set}/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      BACKUP_DIR: /backups
    volumes:
      - ${APP_ROOT}/backups:/backups
    ports:
      # Always on this server only; Caddy (or your own proxy) is the public door.
      - "127.0.0.1:${APP_PORT:-3100}:3000"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    # Answering, not only running: a stuck app shows as unhealthy, and deploy/vps/watchdog.sh restarts it.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    # A runaway app is stopped and restarted on its own before it can push the database out of memory.
    mem_limit: 3g

  postgres:
    image: postgres:17-alpine
    profiles: ["localdb"]
    restart: unless-stopped
    # The last thing the system stops when memory runs short.
    oom_score_adj: -500
    environment:
      POSTGRES_USER: myseed
      POSTGRES_DB: myseed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myseed -d myseed"]
      interval: 5s
      timeout: 5s
      retries: 20

  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESSES: ${SITE_ADDRESSES:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
