# Free outside schedule: every 10 minutes, checks the site answers (GitHub emails the repository owner when this
# run fails, so it doubles as an uptime alert) and runs the scheduled jobs (reminders, email outbox, backups).
# Set two repository secrets (Settings, Secrets and variables, Actions): APP_URL (https://your-site) and
# CRON_SECRET (the same value as in the hosting settings). Without them the run does nothing.
# GitHub may run it a few minutes late, and pauses schedules in repositories with no activity for 60 days.
name: Scheduled jobs and uptime

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: The site answers
        run: |
          if [ -z "$APP_URL" ]; then echo "APP_URL is not set; nothing to do."; exit 0; fi
          # A sleeping free instance can take a minute to wake up.
          curl -fsS --retry 4 --retry-delay 20 --retry-all-errors --max-time 60 "$APP_URL/api/health"
      - name: Run the scheduled jobs
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set; skipping."; exit 0; fi
          curl -fsS --max-time 290 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/checks"
