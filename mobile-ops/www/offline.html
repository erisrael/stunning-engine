<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Myseed Ops</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f2f2f7; color: #1c1c1e; font: 17px -apple-system, system-ui, sans-serif; }
      body { display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
      .card { max-width: 340px; text-align: center; padding: 28px 24px; border-radius: 28px; background: rgb(255 255 255 / .7); backdrop-filter: blur(20px) saturate(180%); box-shadow: inset 0 1px 0 #fff, 0 10px 34px -10px rgb(0 0 0 / .2); }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0; color: rgb(60 60 67 / .65); line-height: 1.4; }
      button { margin-top: 20px; width: 100%; height: 50px; border: 0; border-radius: 14px; background: #007aff; color: #fff; font: inherit; font-weight: 600; }
      @media (prefers-color-scheme: dark) {
        html, body { background: #000; color: #f2f2f7; }
        .card { background: rgb(44 44 48 / .6); box-shadow: inset 0 1px 0 rgb(255 255 255 / .15), 0 10px 34px -10px #000; }
        p { color: rgb(235 235 245 / .6); }
        button { background: #0a84ff; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>No connection</h1>
      <p>Myseed Ops needs the internet. Check Wi-Fi or mobile data, then try again.</p>
      <button onclick="location.href='https://ops.myseed.com.et/dashboard'">Try again</button>
    </div>
  </body>
</html>
